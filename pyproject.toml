    [project]
    name = "online-cinema"
    version = "0.1.0"
    description = ""
    authors = [
        {name = "Your Name",email = "you@example.com"}
    ]
    readme = "README.md"
    requires-python = "^3.11"
    dependencies = [
        "fastapi (>=0.136.1,<0.137.0)",
        "uvicorn (>=0.46.0,<0.47.0)",
        "sqlalchemy (>=2.0.49,<3.0.0)",
        "alembic (>=1.18.4,<2.0.0)",
        "asyncpg (>=0.31.0,<0.32.0)",
        "pydantic (>=2.13.4,<3.0.0)",
        "pydantic-settings (>=2.14.1,<3.0.0)",
        "celery (>=5.6.3,<6.0.0)",
        "redis (>=7.4.0,<8.0.0)",
        "stripe (>=15.1.0,<16.0.0)",
        "python-jose (>=3.5.0,<4.0.0)",
        "passlib (>=1.7.4,<2.0.0)",
        "python-multipart (>=0.0.27,<0.0.28)",
        "aiosmtplib (>=5.1.0,<6.0.0)",
        "jinja2 (>=3.1.6,<4.0.0)",
        "aioboto3 (>=15.5.0,<16.0.0)",
        "python-dotenv (>=1.2.2,<2.0.0)",
        "email-validator (>=2.3.0,<3.0.0)",
        "psycopg2-binary (>=2.9.12,<3.0.0)"
    ]


    [build-system]
    requires = ["poetry-core>=2.0.0,<3.0.0"]
    build-backend = "poetry.core.masonry.api"

    [tool.poetry]
    package-mode = false

    [dependency-groups]
    dev = [
        "black (>=26.3.1,<27.0.0)",
        "flake8 (>=7.3.0,<8.0.0)",
        "mypy-extensions (>=1.1.0,<2.0.0)",
        "pytest (>=9.0.3,<10.0.0)",
        "pytest-asyncio (>=1.3.0,<2.0.0)",
        "httpx (>=0.28.1,<0.29.0)",
        "pillow (>=12.2.0,<13.0.0)"
    ]

    [tool.pytest.ini_options]
    asyncio_mode = "auto"
    pythonpath = "."
    asyncio_default_test_loop_scope = "function"